---
- name: Mirror GitHub repos to Forgejo
  hosts: localhost
  gather_facts: false
  connection: local

  tasks:
    - name: Sanity check secrets are set
      ansible.builtin.assert:
        that:
          - lookup('env', 'GITHUB_PAT') | length > 0
          - lookup('env', 'FORGEJO_TOKEN') | length > 0
        fail_msg: >-
          GITHUB_PAT and FORGEJO_TOKEN env vars must be set
          in the Semaphore environment.

    - name: Run mirror sync helper
      ansible.builtin.script:
        cmd: files/mirror_github.py
        executable: python3
      register: mirror_result
      changed_when: true

    - name: Show mirror sync results
      ansible.builtin.debug:
        msg: "{{ mirror_result.stdout_lines }}"
