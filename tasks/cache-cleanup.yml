---
- name: Prune build caches (npm/pnpm/uv, n8n assets, WGDashboard)
  script: files/cache_cleanup.sh
  register: cache_cleanup_result
  changed_when: "'CHANGED' in cache_cleanup_result.stdout"

- name: Display cache cleanup result
  debug:
    msg: "{{ cache_cleanup_result.stdout | trim }}"
  when: cache_cleanup_result.stdout | trim | length > 0
