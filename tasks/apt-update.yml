---
- name: Check if update command is available
  command: which update
  register: update_command_check
  changed_when: false
  failed_when: false

- name: Set update command availability fact
  set_fact:
    update_command_available: "{{ update_command_check.rc == 0 }}"
    update_command_path: "{{ update_command_check.stdout }}"

- name: Install expect for automated update script interaction (Debian/Ubuntu)
  apt:
    name: expect
    state: present
    update_cache: false
  when:
    - update_command_available | bool
    - ansible_os_family == "Debian"
  register: expect_install_result_apt
  ignore_errors: true

- name: Install expect for automated update script interaction (Alpine)
  apk:
    name: expect
    state: present
    update_cache: false
  when:
    - update_command_available | bool
    - ansible_os_family == "Alpine"
  register: expect_install_result_apk
  ignore_errors: true

- name: Set expect availability fact
  set_fact:
    expect_available: >-
      {{ (expect_install_result_apt is success) or
         (expect_install_result_apk is success) }}
  when: update_command_available | bool

- name: Determine if apt tasks should run
  set_fact:
    run_apt_tasks: "{{ ansible_os_family == 'Debian' and (not (update_command_available | default(false) | bool) or not (expect_available | default(false) | bool)) }}"  # yamllint disable-line rule:line-length

- name: Run update command with expect (auto-select Silent Mode)
  shell: |
    expect <<'EOF'
    set timeout 600
    spawn bash {{ update_command_path }}
    expect {
      # New community-scripts whiptail radiolist: "Silent Mode" is the first
      # (pre-selected) entry, so a bare Enter accepts it. Match the menu title
      # or the entry itself and confirm the default selection.
      -re "Silent Mode|LXC Update/Setting|Support/Update functions" {
        send "\r"
        exp_continue
      }
      # Legacy numeric prompt kept for older scripts.
      "Choose an option:" {
        send "1\r"
        exp_continue
      }
      # whiptail <Ok>/<Yes> buttons: accept with Enter.
      -re "<Ok>|<Yes>" {
        send "\r"
        exp_continue
      }
      # Interactive-mode guard prompts (never shown in Silent Mode). Match the whole
      # family ("Continue anyway? [y/N] (auto-n in 60s):" etc.) and confirm
      # immediately before the 60s auto-no fires.
      -re "Continue anyway" {
        send "y\r"
        exp_continue
      }
      -re "\\(auto-n in" {
        send "y\r"
        exp_continue
      }
      timeout {
        # Do not hang forever if a prompt text changes again; let the run finish
        # so failed_when can judge on the real exit code.
        exp_continue
      }
      eof
    }
    catch wait result
    exit [lindex $result 3]
    EOF
  environment:
    TERM: xterm-256color
    LINES: "24"
    COLUMNS: "80"
  when:
    - update_command_available | bool
    - expect_available | default(false) | bool
  register: update_command_result
  changed_when: true
  # Judged by the next task so a failure reports the updater's own reason.
  failed_when: false
  async: 900
  poll: 10

# Only fail on a genuine non-zero exit code. The community-scripts helper
# returns rc 0 on success even though its whiptail TUI prints text that used
# to trip the old substring matches (false-positive failures on n8n etc.).
# In Silent Mode the updater is "unattended" and never prompts: rc 113 =
# under-provisioned CPU/RAM, rc 114 = disk > 80%. tasks/lxc-rightsize.yml fixes
# both on the Proxmox run beforehand; if one still happens, say so plainly.
- name: Fail if update command failed
  fail:
    msg: >-
      {{ update_command_path }} exited rc {{ update_command_result.rc }}:
      {{ {'113': 'under-provisioned CPU/RAM vs community-scripts minimum',
          '114': 'rootfs over 80% full'}[update_command_result.rc | string]
         | default((update_command_result.stdout | default('')
                    | regex_findall('(?:Aborted|ERROR|Error)[^\r\n\x1b]*') | last)
                   | default('see stdout')) }}
  when:
    - update_command_result.rc is defined
    - update_command_result.rc != 0

- name: Display update command completion
  debug:
    msg: "Custom update script completed: {{ update_command_path }}"
  when:
    - update_command_available | bool
    - expect_available | default(false) | bool

- name: Warn if update script exists but expect unavailable
  debug:
    msg: "WARNING: Update script found at {{ update_command_path }} but expect package unavailable. Falling back to apt update."  # yamllint disable-line rule:line-length
  when:
    - update_command_available | bool
    - not (expect_available | default(false) | bool)

- name: Clean apt cache to free up space
  apt:
    clean: true
  when: run_apt_tasks | default(true) | bool

- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600
  register: apt_update_result
  when: run_apt_tasks | default(true) | bool

- name: Check available disk space on root partition
  shell: |
    set -o pipefail
    df / | tail -1 | awk '{print $4}'
  args:
    executable: /bin/bash
  register: disk_space_available
  changed_when: false
  when: run_apt_tasks | default(true) | bool

- name: Warn if disk space is critically low
  debug:
    msg: "WARNING: Low disk space detected ({{ (disk_space_available.stdout | int / 1024) | round(0) }} MB available). Upgrades may fail if more space is needed."  # yamllint disable-line rule:line-length
  when:
    - not (update_command_available | default(false) | bool)
    - disk_space_available.stdout is defined
    - disk_space_available.stdout | int < 512000

- name: Fully upgrade all packages to the latest version
  apt:
    upgrade: full
    force_apt_get: true
  register: apt_upgrade_result
  when: run_apt_tasks | default(true) | bool

- name: Remove unnecessary packages
  apt:
    autoremove: true
    purge: true
  when: run_apt_tasks | default(true) | bool

- name: Clean apt package cache
  apt:
    autoclean: true
  when: run_apt_tasks | default(true) | bool

- name: Check if reboot is required
  stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Display reboot notification
  debug:
    msg: "WARNING: System reboot is required after updates!"
  when: reboot_required.stat.exists

- name: Show upgrade summary
  debug:
    msg: "{{ (update_command_available | default(false)) | ternary('Custom update script completed', (apt_upgrade_result.changed | default(false)) | ternary('Upgraded packages successfully', 'No packages upgraded (already up to date)')) }}"  # yamllint disable-line rule:line-length
